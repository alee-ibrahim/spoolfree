# Default values. See ../../values.example.yaml for a commented example.
replicaCount: 1

image:
  repository: ghcr.io/alee-ibrahim/spoolfree
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Non-secret settings, rendered into a ConfigMap and loaded with envFrom.
config:
  PUBLIC_URL: https://spoolfree.example.org
  LDAP_URL: ldaps://dc1.example.org:636
  LDAP_BASE_DN: DC=example,DC=org
  LDAP_BIND_DN: CN=svc-spoolfree,OU=Service Accounts,DC=example,DC=org
  AUTH_MICROSOFT_ENTRA_ID_ISSUER: https://login.microsoftonline.com/00000000-0000-0000-0000-000000000000/v2.0
  # group (default) or entra-assignment; see docs/admin-access.md
  ADMIN_ACCESS_MODE: group
  ADMIN_GROUP_IDS: 00000000-0000-0000-0000-000000000000
  POLL_INTERVAL_SECONDS: "120"
  LOW_TONER_PERCENT: "15"

# Name of an existing Secret with the sensitive variables:
#   DATABASE_URL, AUTH_SECRET, AUTH_MICROSOFT_ENTRA_ID_ID, AUTH_MICROSOFT_ENTRA_ID_SECRET,
#   LDAP_BIND_PASSWORD, MANIFEST_SIGNING_KEY, AGENT_ENROLLMENT_TOKEN,
#   and optionally METRICS_TOKEN, ALERT_WEBHOOK_URL.
# Create it with your secret manager. The chart never creates secrets.
existingSecret: spoolfree

# Optional AD sync sidecar (spoolfree-adsync). For domains where a simple LDAP bind is not possible
# (LDAP signing required, no LDAPS certificate): the sidecar binds with Kerberos (SASL GSSAPI, sealed)
# and pushes a snapshot of OUs and computers to the app every intervalSeconds. Enabling it sets
# DIRECTORY_MODE=snapshot on the app. See docs/deployment.md ("AD sync sidecar").
adsync:
  enabled: false
  image:
    repository: ghcr.io/alee-ibrahim/spoolfree-adsync
    tag: ""            # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent
  # Domain controllers by FQDN (never an IP: the Kerberos service principal is ldap/<fqdn>). Tried in order.
  ldapUrls: []         # [ldap://dc1.example.org, ldap://dc2.example.org]
  realm: ""            # EXAMPLE.ORG
  principal: ""        # sAMAccountName of the read-only account, e.g. svc-spoolfree
  baseDn: ""           # defaults to config.LDAP_BASE_DN
  kdcs: []             # defaults to the ldapUrls hosts
  kvno: auto           # auto: read msDS-KeyVersionNumber after the first bind
  intervalSeconds: 300
  # The bind password, mounted as a file (only the sidecar sees it). name defaults to existingSecret.
  passwordSecret:
    name: ""
    key: LDAP_BIND_PASSWORD
  # Shared token for POST /api/internal/directory-snapshot, mounted as a file in both containers
  # (DIRECTORY_SYNC_TOKEN_FILE / ADSYNC_TOKEN_FILE). 32+ characters. name defaults to existingSecret.
  tokenSecret:
    name: ""
    key: DIRECTORY_SYNC_TOKEN
  # Extra ADSYNC_* variables (e.g. ADSYNC_ENCTYPES, ADSYNC_MIN_SSF, ADSYNC_PAGE_SIZE).
  env: {}
  resources:
    requests: { cpu: 10m, memory: 48Mi }
    limits: { memory: 128Mi }

# Optional: mount the AD CS CA certificate used to validate LDAPS.
ldapCa:
  enabled: false
  configMap: spoolfree-ldap-ca   # must contain the key ca.crt

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: spoolfree.example.org
  tls: []

resources:
  requests: { cpu: 50m, memory: 192Mi }
  limits: { memory: 512Mi }

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile: { type: RuntimeDefault }

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }

serviceMonitor:
  enabled: false
  interval: 60s

nodeSelector: {}
tolerations: []
affinity: {}
