name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pester (Windows PowerShell 5.1)
        shell: powershell
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -MinimumVersion 5.5
          $c = New-PesterConfiguration
          $c.Run.Path = 'agent/tests'
          $c.Run.Exit = $true
          Invoke-Pester -Configuration $c

  adsync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the sidecar image
        run: docker build -t spoolfree-adsync:ci adsync
      - name: Unit tests (inside the image)
        run: docker run --rm --entrypoint python3 -v "$PWD/adsync:/src:ro" -w /src spoolfree-adsync:ci -m unittest discover -s tests -v
      - name: Smoke test (configuration error exits 2)
        run: |
          set +e
          docker run --rm --read-only --tmpfs /tmp spoolfree-adsync:ci --once
          [ $? -eq 2 ]

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/spoolfree -f deploy/values.example.yaml
      - name: Lint with the AD sync sidecar
        run: |
          helm lint deploy/helm/spoolfree -f deploy/values.example.yaml \
            --set adsync.enabled=true --set 'adsync.ldapUrls={ldap://dc1.example.org,ldap://dc2.example.org}' \
            --set adsync.realm=EXAMPLE.ORG --set adsync.principal=svc-spoolfree
